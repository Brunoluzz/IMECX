<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erro interno — Imecx</title>
  <style>
    /*
      Esta página tem de sobreviver mesmo quando o resto da app
      está avariado (é literalmente a página de "algo correu mal"),
      por isso não depende de CSS externo, de context processors
      nem de {% url %} — só HTML e estilo inline.
    */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1b2b;
      color: #f4f6f8;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .icon { font-size: 4rem; }
    h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
    p { opacity: .8; max-width: 32rem; margin: 0 auto; }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: .7rem 1.6rem;
      border-radius: .5rem;
      background: #457B9D;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div>
    <div class="icon">🛠️</div>
    <h1>Ocorreu um erro do nosso lado</h1>
    <p>Tenta novamente daqui a pouco. Se o problema persistir, contacta-nos.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
