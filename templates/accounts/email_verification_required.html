{% extends "base.html" %}

{% block title %}Confirma o teu email — IMECX{% endblock %}

{% block content %}

<section class="section">
    <div class="container">

        <div class="card form-card text-center">

            <span class="section__label">
                Segurança da Conta
            </span>

            <h1 class="section__title">
                Confirma o teu endereço de email
            </h1>

            <p class="section__subtitle">
                Para acederes à tua área pessoal é necessário confirmares o endereço de email associado à tua conta.
            </p>

            <div class="mt-8">

                <a href="{% url 'account_email' %}" class="btn-primary">
                    Gerir Emails
                </a>

            </div>

        </div>

    </div>
</section>

{% endblock %}
