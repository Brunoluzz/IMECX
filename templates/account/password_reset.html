{% extends "account/auth_base.html" %}

{% block title %}
Recuperar palavra-passe — IMECX
{% endblock %}

{% block auth_content %}

<div class="text-center">

<h1 class="section__title">
Recuperar palavra-passe
</h1>

<p class="section__subtitle">

Introduz o teu endereço de email.

</p>

</div>

<form method="post" class="mt-8">

{% csrf_token %}

<div class="field">

<label for="{{ form.email.id_for_label }}">

Email

</label>

{{ form.email }}

{{ form.email.errors }}

</div>

<div class="mt-6 text-center">

<button
class="btn-primary"
type="submit">

Enviar instruções

</button>

</div>

</form>

{% endblock %}
